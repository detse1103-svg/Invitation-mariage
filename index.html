        <div class="env__flap"><div class="flap__out"></div><div class="flap__in"></div></div>
        <div class="seal"><span id="cachet"></span></div>
      </div>
      <button class="btn intro__btn" id="openBtn" type="button"></button>
    </div>
  </div>

  <!-- SITE (rempli depuis config.js) -->
